<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Villa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../ui/style.css">
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-700">VillaSantai</h1>
            <div class="space-x-6">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="katalog.html" class="nav-link">Katalog</a>
                <a href="booking.html" class="text-blue-600 font-semibold">Booking</a>
            </div>
        </div>
    </nav>

    <section class="max-w-lg mx-auto my-12 bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Form Pemesanan</h2>
        <form action="#" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                <input id="nama" type="text" class="w-full mt-1 p-2 border rounded-md outline-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Pilih Villa</label>
                <select id="pilihanVilla" class="w-full mt-1 p-2 border rounded-md outline-blue-500">
                    <option value="">-- Pilih Villa --</option>
                    <option value="Mountain Breeze">Mountain Breeze</option>
                    <option value="Villa Ocean View">Villa Ocean View</option>
                    <option value="Mountain Breeze">Mountain Breeze</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Tanggal Check-in</label>
                <input type="date" id="tanggal" class="w-full mt-1 p-2 border rounded-md outline-blue-500">
            </div>
            <button type="button" class="btn-pesan w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition" onclick="kirimData()">Konfirmasi Pesanan</button>
        </form>
    </section>

    <script src="../logic/script.js"></script>
</body>
</html>
