<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Villa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50">
    <!-- Navbar (Sama) -->
    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-700">VillaSantai</h1>
            <div class="space-x-6">
                <a href="index.html" class="nav-link">Home</a>
                <a href="katalog.html" class="text-blue-600 font-semibold">Katalog</a>
                <a href="booking.html" class="nav-link">Booking</a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <section class="container mx-auto py-12 px-4">
        <h2 class="text-3xl font-bold mb-8 text-center">Koleksi Villa Kami</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Card 1 -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <div class="h-48 bg-gray-300"></div> <!-- Ganti dengan <img> nanti -->
                <div class="p-6">
                    <h3 class="font-bold text-xl mb-2">Villa Ocean View</h3>
                    <p class="text-gray-600 text-sm mb-4">Pemandangan langsung ke laut lepas dengan kolam renang pribadi.</p>
                    <p class="text-blue-600 font-bold mb-4">Rp 2.500.000 / Malam</p>
                    <a href="booking.html" class="block text-center bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Pesan Sekarang</a>
                </div>
            </div>
            <!-- Card 2 -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <div class="h-48 bg-gray-300"></div>
                <div class="p-6">
                    <h3 class="font-bold text-xl mb-2">Mountain Breeze</h3>
                    <p class="text-gray-600 text-sm mb-4">Udara sejuk pegunungan dengan interior kayu yang hangat.</p>
                    <p class="text-blue-600 font-bold mb-4">Rp 1.800.000 / Malam</p>
                    <a href="booking.html" class="block text-center bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Pesan Sekarang</a>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
